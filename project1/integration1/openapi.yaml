openapi: 3.0.1
info:
  title: Integration 1
  description: Project1 integration. Calls Integration 2 in Project2, and passes customer and email requests through to it.
  version: 1.0.0
servers:
- url: "{server}:{port}/"
  variables:
    server:
      default: http://localhost
    port:
      default: "9090"
paths:
  /hello:
    get:
      summary: Calls Integration 2 and returns its greeting
      operationId: getHello
      parameters:
      - name: name
        in: query
        schema:
          type: string
          default: World
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "502":
          description: BadGateway
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /customers:
    get:
      summary: Lists customers
      operationId: getCustomers
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int64
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "502":
          description: BadGateway
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
    post:
      summary: Registers a customer and sends the welcome email
      operationId: postCustomers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
        required: true
      responses:
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "502":
          description: BadGateway
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /customers/{id}:
    get:
      summary: Returns one customer
      operationId: getCustomersId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "502":
          description: BadGateway
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /emails:
    get:
      summary: Lists the emails in the mock outbox, newest first
      operationId: getEmails
      responses:
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "502":
          description: BadGateway
  /emails/{id}:
    get:
      summary: Returns one email, including the rendered HTML
      operationId: getEmailsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "502":
          description: BadGateway
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /emails/{id}/preview:
    get:
      summary: Shows the rendered email as an HTML page
      operationId: getEmailsIdPreview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "502":
          description: BadGateway
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
components:
  schemas:
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    NewCustomer:
      required:
      - email
      - name
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      additionalProperties: false
