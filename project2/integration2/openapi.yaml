openapi: 3.0.1
info:
  title: Integration 2
  description: Project2 integration that returns a JSON greeting.
  version: 1.0.0
servers:
- url: "{server}:{port}/"
  variables:
    server:
      default: http://localhost
    port:
      default: "9090"
paths:
  /greeting:
    get:
      summary: Returns a JSON greeting
      operationId: getGreeting
      parameters:
      - name: name
        in: query
        description: Name to greet
        schema:
          type: string
          default: World
      responses:
        "200":
          description: The greeting
          content:
            application/json:
              schema:
                type: object
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
components:
  schemas:
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
