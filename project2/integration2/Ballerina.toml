[package]
org = "wso2poc"
name = "integration2"
version = "0.1.0"
distribution = "2201.12.8"

[build-options]
observabilityIncluded = true

# Database drivers, loaded by the JDBC client at runtime (DB_TYPE selects the database).
# In-memory H2:
[[platform.java21.dependency]]
groupId = "com.h2database"
artifactId = "h2"
version = "2.3.232"

# Microsoft SQL Server:
[[platform.java21.dependency]]
groupId = "com.microsoft.sqlserver"
artifactId = "mssql-jdbc"
version = "12.8.1.jre11"
